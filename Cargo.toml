[package]
name = "realm-metadata-tool"
version = "0.1.0"
edition = "2021"

[dependencies]
array-init = "*"
bincode = "1"
clap = { version = "*", features = ["derive"] }
hex = "*"
hexdump = "*"
p384 = { version = "0.14", features = [ "pem" ] }
sec1 = "0.8"
semver = "*"
serde = { version = "*", features = ["derive", "alloc"] }
serde-big-array = "*"
serde_derive = "*"
serde_yaml = "*"
thiserror = "*"
